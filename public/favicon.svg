<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Aerospace Hexagon / Shield -->
  <polygon points="32,4 58,16 58,48 32,60 6,48 6,16" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.85"/>
  
  <!-- Aerodynamic UAV Wingtip / Swarm Chevron -->
  <polygon points="32,14 48,34 32,42 16,34" fill="url(#cyanGrad)" filter="url(#glow)"/>
  
  <!-- Central Guidance Core -->
  <circle cx="32" cy="30" r="3" fill="#ffffff"/>
  
  <!-- Trailing Thrust Vectors -->
  <line x1="26" y1="44" x2="20" y2="52" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="44" x2="44" y2="52" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="54" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
